plugins {
    id "com.android.application"
}

android {
    namespace "af.mod.logistics"
    compileSdk 35

    defaultConfig {
        applicationId "af.mod.logistics"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
