plugins { id 'com.android.application' }

android {
    namespace 'com.hafz.offlinefinance'
    compileSdk 35

    defaultConfig {
        applicationId 'com.hafz.offlinefinance'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.biometric:biometric:1.1.0'
}