<!DOCTYPE html>
<html lang="ps" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0B6B36">
    <title>لټون - د افغانستان اسلامي امارت د کره کمیسیون د فورمو د ثبت او مدیریت ډیټابیس</title>
    <link rel="stylesheet" href="./style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <header class="main-header">
        <div class="header-brand">
            <div class="header-logo">🔍</div>
            <div class="header-title" data-system-name>Hafz Admin Online System</div>
        </div>

        <div class="header-actions">
            <button type="button" id="dashboardBtn" title="Dashboard" aria-label="Dashboard">🏠</button>
            <button type="button" id="refreshBtn" title="ریفریش" aria-label="ریفریش">🔄</button>
            <button type="button" id="logoutBtn" title="وتل" aria-label="وتل">🚪</button>
        </div>
    </header>

    <div class="app-layout">
        <aside class="sidebar">
            <div class="sidebar-title">اصلي مینو</div>
            <nav class="sidebar-menu">
                <button type="button" id="dashboardMenuBtn">📊 Dashboard</button>
                <button type="button" id="registerMenuBtn">📝 نوی ثبت</button>
                <button type="button" class="active" id="searchMenuBtn">🔍 لټون</button>
                <button type="button" id="reportsMenuBtn">📄 راپورونه</button>
                <button type="button" id="adminMenuBtn">👥 Admin</button>
                <button type="button" id="settingsMenuBtn">⚙️ تنظیمات</button>
            </nav>
        </aside>

        <main class="main-content">
            <div class="page">
                <section class="page-header">
                    <h1 class="page-title">🔍 د فورم لټون</h1>
                    <p class="page-description">د فورم نمبر، برقي تذکرې، یا کاغذي تذکرې له لارې ثبت شوی کس پیدا کړئ.</p>
                </section>

                <div id="searchMessage" class="alert" style="display:none;" role="alert" aria-live="polite"></div>

                <section class="card">
                    <form id="searchForm" novalidate>
                        <div class="search-box">
                            <div class="form-group">
                                <label class="form-label" for="formNumber">
                                    د فورمي نمبر
                                </label>
                                <input
                                    id="formNumber"
                                    name="formNumber"
                                    type="text"
                                    class="form-control"
                                    placeholder="د فورمي نمبر ولیکئ"
                                    maxlength="100"
                                    autocomplete="off"
                                >
                            </div>

                            <div class="form-group full">
                                <label class="form-label">
                                    د تذکرې ډول
                                </label>

                                <div style="display:flex;gap:14px;flex-wrap:wrap;">
                                    <label class="form-control" style="display:flex;align-items:center;gap:8px;cursor:pointer;">
                                        <input type="radio" name="searchTazkiraType" id="searchTazkiraTypeElectronic" value="electronic" checked>
                                        <span>برقي تذکره</span>
                                    </label>

                                    <label class="form-control" style="display:flex;align-items:center;gap:8px;cursor:pointer;">
                                        <input type="radio" name="searchTazkiraType" id="searchTazkiraTypePaper" value="paper">
                                        <span>کاغذي تذکره</span>
                                    </label>
                                </div>
                            </div>

                            <div class="form-group" id="searchElectronicGroup">
                                <label class="form-label" for="tazkira">
                                    د تذکرې نمبر
                                </label>
                                <input
                                    id="tazkira"
                                    name="tazkira"
                                    type="text"
                                    class="form-control"
                                    placeholder="0000-0000-00000"
                                    maxlength="15"
                                    autocomplete="off"
                                    dir="ltr"
                                >
                                <div class="form-help">بڼه: 0000-0000-00000</div>
                                <div class="form-error" id="tazkiraError"></div>
                            </div>

                            <div class="form-group" id="searchPaperVolumeGroup" style="display:none;">
                                <label class="form-label" for="paperSearchVolume">
                                    جلد
                                </label>
                                <input
                                    id="paperSearchVolume"
                                    type="text"
                                    class="form-control"
                                    placeholder="جلد"
                                    inputmode="numeric"
                                    maxlength="20"
                                >
                            </div>

                            <div class="form-group" id="searchPaperPageGroup" style="display:none;">
                                <label class="form-label" for="paperSearchPage">
                                    صفحه
                                </label>
                                <input
                                    id="paperSearchPage"
                                    type="text"
                                    class="form-control"
                                    placeholder="صفحه"
                                    inputmode="numeric"
                                    maxlength="20"
                                >
                            </div>

                            <div class="form-group" id="searchPaperNumberGroup" style="display:none;">
                                <label class="form-label" for="paperSearchNumber">
                                    ګڼه
                                </label>
                                <input
                                    id="paperSearchNumber"
                                    type="text"
                                    class="form-control"
                                    placeholder="ګڼه"
                                    inputmode="numeric"
                                    maxlength="20"
                                >
                            </div>

                            <div class="form-group">
                                <label class="form-label" style="visibility:hidden;">عملیات</label>
                                <button type="submit" class="btn btn-primary" id="searchBtn">🔍 لټون</button>
                            </div>
                        </div>

                        <div class="form-actions" style="margin-top:14px;">
                            <button type="button" class="btn btn-secondary" id="clearBtn">🧹 پاکول</button>
                            <button type="button" class="btn btn-secondary" id="backBtn">⬅ شاته</button>
                        </div>
                    </form>
                </section>

                <section class="card search-results" style="margin-top:14px;">
                    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px;">
                        <div>
                            <h2 style="font-size:20px;font-weight:800;">📄 د لټون پایله</h2>
                            <p style="color:var(--muted-color);font-size:13px;">دلته به د پیدا شوې فورمې ټول معلومات ښکاره شي.</p>
                        </div>

                        <div class="badge badge-info" id="resultBadge">چمتو</div>
                    </div>

                    <div id="searchResult">
                        <div class="search-empty">
                            د لټون لپاره پورته فورمه وکاروه.
                        </div>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <footer class="footer">
        Hafz Admin Online System
    </footer>

    <script type="module" src="./search.js"></script>
</body>
</html>
