name: Publish Finance V25 APK for File Sharing

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "login.html"
      - ".github/workflows/publish-finance-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Download and verify official Finance V25 APK
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            "https://github.com/hafzaywb553-alt/Hafz-Admin-Online-System/releases/download/finance-v25-keyboard-focus-fix-20261127/Finance-App-V25-Keyboard-Focus-Fix.apk" \
            -o /tmp/Finance-App-V25-Keyboard-Focus-Fix.apk
          test -s /tmp/Finance-App-V25-Keyboard-Focus-Fix.apk
          printf '%s  %s\n' "7ac6cf62799fe51616c721e08710360e00afbc389c737a1817d268dfa6c1340d" "/tmp/Finance-App-V25-Keyboard-Focus-Fix.apk" | sha256sum -c -
          unzip -tq /tmp/Finance-App-V25-Keyboard-Focus-Fix.apk

      - name: Publish APK to repository for direct file sharing
        run: |
          install -m 644 /tmp/Finance-App-V25-Keyboard-Focus-Fix.apk Finance-App-V25-Keyboard-Focus-Fix.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Finance-App-V25-Keyboard-Focus-Fix.apk
          if git diff --cached --quiet; then
            echo "Finance V25 APK is already up to date."
          else
            git commit -m "Publish Finance V25 APK for direct file sharing"
            git push origin HEAD:main
          fi
