name: Global i18n Preview

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - "README.txt"

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR merge ref
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: hafz-admin-online-system
          workload_identity_provider: projects/941143292545/locations/global/workloadIdentityPools/github-actions/providers/github-actions
          service_account: github-action-1325369453@hafz-admin-online-system.iam.gserviceaccount.com

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Run global i18n tests
        id: i18n_tests
        continue-on-error: true
        run: |
          npm run test:i18n 2>&1 | tee test-output.txt

      - name: Comment i18n test output on PR
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require("fs");
            const output = fs.existsSync("test-output.txt") ? fs.readFileSync("test-output.txt", "utf8") : "No test output file was produced.";
            const body = "## Global i18n CI result\n\nTest outcome: **" + "${{ steps.i18n_tests.outcome }}" + "**\n\n```text\n" + output.slice(-12000) + "\n```";
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

      - name: Stop on failed i18n tests
        if: steps.i18n_tests.outcome != 'success'
        run: exit 1

      - name: Deploy temporary Firebase preview
        if: steps.i18n_tests.outcome == 'success'
        run: firebase hosting:channel:deploy pr-${{ github.event.pull_request.number }} --project hafz-admin-online-system --expires 7d --json | tee firebase-preview.json

      - name: Publish preview URL
        run: |
          firebase hosting:channel:open pr-${{ github.event.pull_request.number }} --project hafz-admin-online-system 2>&1 | tee firebase-preview-open.txt
          URL=$(grep -Eo 'https://[^[:space:]"]+\.web\.app' firebase-preview-open.txt | tail -1)
          if [ -z "$URL" ]; then
            cat firebase-preview-open.txt
            exit 1
          fi
          echo "PREVIEW_URL=$URL"
          {
            echo "## Global i18n Firebase Preview"
            echo
            echo "$URL"
          } >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$URL" > firebase-preview-url.txt
