name: Deploy Firebase Hosting

on:
  push:
    branches:
      - main
      - local-sync
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: hafz-admin-online-system
          workload_identity_provider: projects/941143292545/locations/global/workloadIdentityPools/github-actions/providers/github-actions
          service_account: github-action-1325369453@hafz-admin-online-system.iam.gserviceaccount.com

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Update version.json
        run: |
          python - <<'PY2'
          import json
          import os
          from pathlib import Path

          version = os.environ.get("GITHUB_SHA", "")[:7]
          if not version:
              raise SystemExit("GITHUB_SHA not available")

          Path("version.json").write_text(
              json.dumps(
                  {"version": version},
                  ensure_ascii=False,
                  indent=2
              ) + "\n"
          )
          PY2

      - name: Deploy Firebase Hosting
        run: firebase deploy --only hosting --project hafz-admin-online-system
