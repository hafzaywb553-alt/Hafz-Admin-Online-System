name: Build Finance V23 - Audited Core Repairs

on:
  push:
    branches:
      - finance-v23-core-audit-fixes-20261121
    paths:
      - "offline-apk/**"
      - ".github/workflows/build-finance-v22-four-sections.yml"
      - "FINANCE-V22-FOUR-SECTIONS-README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build, test and publish Finance V22 APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Restore the verified original V18 HTML source
        shell: bash
        run: |
          set -euo pipefail
          asset="offline-apk/app/src/main/assets"
          cat \
            "$asset/index.html.gz.b64" \
            "$asset/index.html.gz.part01" \
            "$asset/index.html.gz.part02" \
            "$asset/index.html.gz.part03" \
            "$asset/index.html.gz.part04" \
            "$asset/index.html.gz.part05" \
            "$asset/index.html.gz.part06" \
            "$asset/index.html.gz.part07" \
            | base64 --decode | gzip --decompress --stdout > "$asset/index.html"
          echo "a698e9f156e5826108b3a11653e70c594172d1d10f8498e029c9bfb21f5a08ed  $asset/index.html" | sha256sum --check
          test "$(wc -c < "$asset/index.html")" -eq 149876

      - name: Add the existing leave calculator
        run: python offline-apk/tools/add_leave_calculator.py

      - name: Exclude Fridays from leave-day count
        run: python offline-apk/tools/exclude_fridays_from_leave.py

      - name: Test leave calculations in all three calendars
        run: node offline-apk/tools/test_leave_calculator.js
      - name: Add four-section navigation and remove date help
        run: python offline-apk/tools/add_four_section_navigation.py

      - name: Test four-section navigation and date-help removal
        run: node offline-apk/tools/test_four_section_navigation.js

      - name: Preserve V22 salary tables for byte-for-byte comparison
        run: cp offline-apk/app/src/main/assets/index.html /tmp/finance-v22-before-v23.html

      - name: Apply audited V23 core repairs (do not change salary/allowance tables)
        run: python offline-apk/tools/patch_finance_v23_core_fixes.py

      - name: Test V23 calculations and verify owner-defined tables are unchanged
        run: node offline-apk/tools/test_finance_v23_core_fixes.js offline-apk/app/src/main/assets/index.html /tmp/finance-v22-before-v23.html

      - name: Verify Android integration safeguards
        run: |
          python - <<'PY'
          from pathlib import Path
          manifest = Path("offline-apk/app/src/main/AndroidManifest.xml").read_text(encoding="utf-8")
          java = Path("offline-apk/app/src/main/java/com/hafz/offlinefinance/MainActivity.java").read_text(encoding="utf-8")
          gradle = Path("offline-apk/app/build.gradle").read_text(encoding="utf-8")
          checks = {
              "keyboard resize": 'android:windowSoftInputMode="adjustResize"' in manifest,
              "Android edge-to-edge inset handling": "WindowCompat.setDecorFitsSystemWindows" in java and "WindowInsetsCompat.Type.systemBars()" in java,
              "phone dialer link handling": '"tel".equals(scheme)' in java and "Intent.ACTION_DIAL" in java,
              "Android 11+ biometric plus device PIN": "BIOMETRIC_STRONG" in java and "DEVICE_CREDENTIAL" in java,
              "legacy Android device-credential fallback": "setDeviceCredentialAllowed(true)" in java and "isDeviceCredentialSecure()" in java,
              "V23 package and version": "com.hafz.offlinefinance.v23" in gradle and "versionCode 23" in gradle and "versionName '2.3'" in gradle,
              "minimum Android 6": "minSdk 23" in gradle,
          }
          for label, ok in checks.items():
              print(("PASS" if ok else "FAIL") + ": " + label)
          if not all(checks.values()):
              raise SystemExit("Android integration checks failed.")
          PY

      - name: Check application JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("offline-apk/app/src/main/assets/index.html").read_text(encoding="utf-8")
          marker = "<script>"
          if marker not in source or "</script>" not in source:
              raise SystemExit("Inline application JavaScript is missing.")
          script = source.split(marker, 1)[1].split("</script>", 1)[0]
          Path("/tmp/finance-v22-inline.js").write_text(script, encoding="utf-8")
          PY
          node --check /tmp/finance-v22-inline.js

      - name: Fetch the official app logo
        run: |
          mkdir -p offline-apk/app/src/main/assets offline-apk/app/src/main/res/drawable-nodpi
          curl -fL --retry 3 --retry-delay 2 "https://asset.brandfetch.io/idlPl1eH_L/id7y_FVBYZ.png?updated=1711333942835" -o offline-apk/app/src/main/assets/mof-logo.png
          cp offline-apk/app/src/main/assets/mof-logo.png offline-apk/app/src/main/res/drawable-nodpi/mof_logo.png
          test -s offline-apk/app/src/main/assets/mof-logo.png
          test -s offline-apk/app/src/main/res/drawable-nodpi/mof_logo.png

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build universal APK
        run: gradle -p offline-apk :app:assembleDebug --no-daemon

      - name: Verify package, signature and device compatibility metadata
        shell: bash
        run: |
          set -euo pipefail
          apk="offline-apk/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          badging="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk")"
          printf '%s\n' "$badging" | grep "package: name='com.hafz.offlinefinance.v23' versionCode='23' versionName='2.3'"
          printf '%s\n' "$badging" | grep "sdkVersion:'23'"
          printf '%s\n' "$badging" | grep "targetSdkVersion:'35'"
          if unzip -Z1 "$apk" | grep -q '^lib/'; then
            echo "Unexpected ABI-specific native library found; APK is not universal."
            exit 1
          fi
          mkdir -p dist-apk
          cp "$apk" dist-apk/Finance-App-V23-Verified.apk
          sha256sum dist-apk/Finance-App-V23-Verified.apk
          ls -lh dist-apk/Finance-App-V23-Verified.apk

      - name: Upload installable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Finance-App-V22-Four-Tabs
          path: dist-apk/Finance-App-V23-Verified.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish direct APK download
        if: github.event_name == 'push' && github.ref == 'refs/heads/finance-v23-core-audit-fixes-20261121'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: finance-v23-core-audit-fixes-20261121
          name: Finance V23 - Audited Core Repairs
          body: |
            Finance V23 repairs calculation validation, Solar Hijri leap-year handling, per-period tax, calendar month localization, local-storage error handling and inaccurate lunar fallback.
            The owner-provided salary, grade and allowance tables and existing tax bands are preserved unchanged and are not independently certified.
            The four original sections and date-conversion screen remain in the original order.
            Android minimum: 6.0 (API 23). Universal APK; build, package metadata and signature are verified.
            Package: com.hafz.offlinefinance.v23
          files: dist-apk/Finance-App-V23-Verified.apk
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  device-smoke:
    name: Install and launch on Android API ${{ matrix.api-level }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [23, 29, 35]
    steps:
      - name: Download verified APK
        uses: actions/download-artifact@v4
        with:
          name: Finance-App-V23-Verified
          path: dist-apk

      - name: Install and launch on Android emulator
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          script: |
            set -euo pipefail
            adb install --no-streaming -r dist-apk/Finance-App-V23-Verified.apk
            adb shell am start -n com.hafz.offlinefinance.v23/.MainActivity
            sleep 8
            adb shell pidof com.hafz.offlinefinance.v23
            if adb logcat -d -s AndroidRuntime:E | grep -q "FATAL EXCEPTION"; then
              adb logcat -d -s AndroidRuntime:E
              exit 1
            fi
            echo "Android API ${{ matrix.api-level }} install and launch smoke test passed."