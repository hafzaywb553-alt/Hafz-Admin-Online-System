name: Export current AppDeploy project source
on:
  push:
    branches:
      - appdeploy-current-source-2026-09-30
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build source zip
        run: |
          rm -rf .git
          zip -r /tmp/finance-management-project.zip . -x ".github/workflows/export-project.yml"
      - name: Upload source zip
        uses: actions/upload-artifact@v4
        with:
          name: finance-management-project-2026-09-30
          path: /tmp/finance-management-project.zip
          if-no-files-found: error
