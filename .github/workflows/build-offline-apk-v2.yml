name: Build Finance App V18 with native APK sharing

on:
  push:
    branches: [offline-three-sections-v2, finance-share-v18-20261111]
  pull_request:
    branches: [main, offline-three-sections-v2, finance-share-v18-20261111]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and verify Finance App V18
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Reconstruct the exact V17 app HTML with V18 contact actions
        shell: bash
        run: |
          set -euo pipefail
          asset="offline-apk/app/src/main/assets"
          {
            cat "$asset/index.html.gz.b64"
            for part in 01 02 03 04 05 06 07; do
              cat "$asset/index.html.gz.part$part"
            done
          } | base64 --decode | gzip --decompress > "$asset/index.html"
          echo "a698e9f156e5826108b3a11653e70c594172d1d10f8498e029c9bfb21f5a08ed  $asset/index.html" | sha256sum --check
          grep -q 'id="shareApp"' "$asset/index.html"
          grep -q 'id="downloadCommission"' "$asset/index.html"
          grep -q 'NativeApp.shareCurrentApk' "$asset/index.html"
          grep -q 'NativeApp.downloadCommissionApk' "$asset/index.html"
          if grep -q 'id="copyContact"' "$asset/index.html"; then
            echo "The frozen copy button is still present."
            exit 1
          fi
          python - <<'PY'
          from pathlib import Path
          source = Path("offline-apk/app/src/main/assets/index.html").read_text()
          marker = "<script>"
          if marker not in source:
              raise SystemExit("Inline app script missing.")
          script = source.split(marker, 1)[1].split("</script>", 1)[0]
          Path("/tmp/finance-v18-inline.js").write_text(script)
          PY
          node --check /tmp/finance-v18-inline.js

      - name: Fetch official Ministry of Finance logo
        run: |
          mkdir -p offline-apk/app/src/main/assets offline-apk/app/src/main/res/drawable-nodpi
          curl -fL --retry 3 --retry-delay 2 "https://asset.brandfetch.io/idlPl1eH_L/id7y_FVBYZ.png?updated=1711333942835" -o offline-apk/app/src/main/assets/mof-logo.png
          cp offline-apk/app/src/main/assets/mof-logo.png offline-apk/app/src/main/res/drawable-nodpi/mof_logo.png
          test -s offline-apk/app/src/main/assets/mof-logo.png
          test -s offline-apk/app/src/main/res/drawable-nodpi/mof_logo.png

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p offline-apk :app:assembleDebug --no-daemon

      - name: Verify APK package, signature and native sharing components
        shell: bash
        run: |
          set -euo pipefail
          apk="offline-apk/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep "package: name='com.hafz.offlinefinance.v18'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree "$apk" AndroidManifest.xml | grep -q 'androidx.core.content.FileProvider'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$apk" | grep -q 'android.permission.INTERNET'
          mkdir -p dist-apk
          cp "$apk" dist-apk/Finance-App-V18.apk
          sha256sum dist-apk/Finance-App-V18.apk
          ls -lh dist-apk/Finance-App-V18.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Finance-App-V18
          path: dist-apk/Finance-App-V18.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct V18 APK download
        if: github.event_name == 'push' && github.ref == 'refs/heads/finance-share-v18-20261111'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: finance-share-v18-${{ github.run_number }}
          name: Finance App V18 - Native APK Sharing
          body: |
            Finance App V18.
            Package: com.hafz.offlinefinance.v18
            The Contacts section shares the currently installed Finance APK using Android's native Sharesheet.
            The Contacts section also downloads the Karah Commission Forms app APK directly.
            The V17 HTML source was reconstructed and SHA-256 checked before compilation.
            This is a new package ID because the previous private signing key is unavailable. V17 remains separate and its local data is not migrated.
          files: dist-apk/Finance-App-V18.apk
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
