name: Build Finance App V18 with native APK sharing

on:
  push:
    branches: [offline-three-sections-v2, finance-share-v18-20261111]
  pull_request:
    branches: [main, offline-three-sections-v2, finance-share-v18-20261111]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and verify Finance App V18
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download and verify the exact V16 base APK
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            "https://raw.githubusercontent.com/hafzaywb553-alt/GhazBadloon/main/Finance-App-V16.apk" \
            -o /tmp/Finance-App-V16.apk
          echo "13d7b60f123b42b1dc32b7f48c5f2b5bf6e71db627d9951d2c29d9d997fb2c43  /tmp/Finance-App-V16.apk" | sha256sum --check

      - name: Rebuild exact V17 HTML and patch only Contacts for V18
        shell: bash
        run: |
          set -euo pipefail
          asset="offline-apk/app/src/main/assets"
          python offline-apk/tools/rebuild_v17_from_v16.py \
            /tmp/Finance-App-V16.apk "$asset/index.html"
          python offline-apk/tools/apply_v18_contacts.py "$asset/index.html"
          grep -q 'id="shareApp"' "$asset/index.html"
          grep -q 'id="downloadCommission"' "$asset/index.html"
          grep -q 'NativeApp.shareCurrentApk' "$asset/index.html"
          grep -q 'NativeApp.downloadCommissionApk' "$asset/index.html"
          if grep -q 'id="copyContact"' "$asset/index.html"; then
            echo "The old Contacts copy button remains."
            exit 1
          fi
          python - <<'PY'
          from pathlib import Path
          source = Path("offline-apk/app/src/main/assets/index.html").read_text(encoding="utf-8")
          marker = "<script>"
          if marker not in source or "</script>" not in source:
              raise SystemExit("Inline app JavaScript is missing.")
          script = source.split(marker, 1)[1].split("</script>", 1)[0]
          Path("/tmp/finance-v18-inline.js").write_text(script, encoding="utf-8")
          PY
          node --check /tmp/finance-v18-inline.js

      - name: Fetch official Ministry of Finance logo
        run: |
          mkdir -p offline-apk/app/src/main/assets offline-apk/app/src/main/res/drawable-nodpi
          curl -fL --retry 3 --retry-delay 2 "https://asset.brandfetch.io/idlPl1eH_L/id7y_FVBYZ.png?updated=1711333942835" -o offline-apk/app/src/main/assets/mof-logo.png
          cp offline-apk/app/src/main/assets/mof-logo.png offline-apk/app/src/main/res/drawable-nodpi/mof_logo.png
          test -s offline-apk/app/src/main/assets/mof-logo.png
          test -s offline-apk/app/src/main/res/drawable-nodpi/mof_logo.png

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p offline-apk :app:assembleDebug --no-daemon

      - name: Verify APK package, signature and native sharing components
        shell: bash
        run: |
          set -euo pipefail
          apk="offline-apk/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$apk" | grep "package: name='com.hafz.offlinefinance.v18'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree "$apk" AndroidManifest.xml | grep -q 'androidx.core.content.FileProvider'
          permissions="$("$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$apk")"
          printf '%s\n' "$permissions" | grep -q 'android.permission.INTERNET'
          printf '%s\n' "$permissions" | grep -q 'android.permission.WRITE_EXTERNAL_STORAGE'
          mkdir -p dist-apk
          cp "$apk" dist-apk/Finance-App-V18.apk
          sha256sum dist-apk/Finance-App-V18.apk
          ls -lh dist-apk/Finance-App-V18.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Finance-App-V18
          path: dist-apk/Finance-App-V18.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct V18 APK download
        if: github.event_name == 'push' && github.ref == 'refs/heads/finance-share-v18-20261111'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: finance-share-v18-20261111-final
          name: Finance App V18 - Native APK Sharing
          body: |
            Finance App V18.
            Package: com.hafz.offlinefinance.v18
            The Contacts section shares the installed Finance APK using Android's native Sharesheet.
            The Contacts section downloads the Karah Commission Forms app APK directly.
            V17 HTML is reconstructed from the exact V16 source and SHA-256 checked before patching Contacts.
            New package ID is required because the original private signing key is unavailable. V17 stays installed separately; local data is not migrated.
          files: dist-apk/Finance-App-V18.apk
          make_latest: false
        env:
          GITHUB_TOKEN: \${{ secrets.GITHUB_TOKEN }}
