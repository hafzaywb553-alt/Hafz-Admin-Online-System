name: Build Offline Finance APK v2

on:
  push:
    branches: [offline-three-sections-v2]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p offline-apk :app:assembleDebug --no-daemon

      - name: Verify APK
        run: |
          test -s offline-apk/app/build/outputs/apk/debug/app-debug.apk
          sha256sum offline-apk/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: finance-offline-apk-v2
          path: offline-apk/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
